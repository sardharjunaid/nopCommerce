name: workflow for dotnet
on:
    pull_request:
        branches:
            - develop
    workflow_dispatch:
jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - name: setup dotnet
              uses: actions/setup-dotnet@v5
              with:
                  dotnet-version: 9.0.x
            - name: checkout
              uses: actions/checkout@v5
            - name: restore
              run: dotnet restore src/Presentation/Nop.Web/Nop.Web.csproj
            - name: build
              run: dotnet build --configuration Release src/Presentation/Nop.Web/Nop.Web.csproj
            - name: publish the package
              run: dotnet publish --configuration Release src/Presentation/Nop.Web/Nop.Web.csproj -o published/
