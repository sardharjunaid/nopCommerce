name: workflow for dotnet
on:
  push:
    branches:
      - feature
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: setup dotnet
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            9.0.203
      - name: checkout
        uses: actions/checkout@v5
      - name: build .NET
        run: dotnet build --configuration Release src/Presentation/Nop.Web/Nop.Web.csproj
      - name: Copy Themes for tests
        run: |
          mkdir -p src/Tests/Nop.Tests/bin/Debug/net9.0/Themes
          cp -R src/Presentation/Nop.Web/Themes/* src/Tests/Nop.Tests/bin/Debug/net9.0/Themes/

      - name: test
        run: dotnet test src/Tests/Nop.Tests/Nop.Tests.csproj
      - name: publish the .NET package
        run: dotnet publish --configuration Release src/Presentation/Nop.Web/Nop.Web.csproj -o published/
